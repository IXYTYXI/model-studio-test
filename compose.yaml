services:
  model-studio:
    build:
      context: .
      network: none
      pull: false
    image: model-studio:local
    init: true
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - model-studio-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16777216,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128

volumes:
  model-studio-data:
